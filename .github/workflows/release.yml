name: Release

# Publication requires an explicitly published GitHub release. Protect the
# `pypi` and `mcp-registry` environments with required reviewers.
on:
  release:
    types: [published]

permissions:
  contents: read

env:
  UV_VERSION: "0.11.32"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  package:
    name: Validate release and build once
    needs: ci
    outputs:
      is_prerelease: ${{ steps.release_metadata.outputs.is_prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Install exact uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          checksum: "aab924fd522efd06f1c5f3b93a243864fc453132c94b2dc49f1371b528a4b967"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-groups
      - name: Require exact tag, source, registry and release kind
        id: release_metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path
          from packaging.version import Version
          from kwork_mcp.version import __version__

          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{__version__}":
              raise SystemExit(f"release tag {tag!r} does not match v{__version__}")
          source_is_prerelease = Version(__version__).is_prerelease
          event_is_prerelease = os.environ["RELEASE_PRERELEASE"].casefold() == "true"
          if source_is_prerelease != event_is_prerelease:
              raise SystemExit(
                  "GitHub release prerelease flag does not match source version"
              )
          registry = json.loads(Path("server.json").read_text())
          if registry["version"] != __version__:
              raise SystemExit("server.json top-level version mismatch")
          if {item["version"] for item in registry["packages"]} != {__version__}:
              raise SystemExit("server.json package version mismatch")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(
                  f"is_prerelease={str(source_is_prerelease).lower()}\n"
              )
          print(f"release metadata verified: {tag}")
          PY
      - run: uv build --no-sources
      - run: uv run twine check dist/*
      - run: uv run check-wheel-contents dist/*.whl
      - name: Smoke-test the exact wheel that will be attested
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          bash scripts/smoke-wheel.sh "$wheel"
      - name: Attest package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Upload validated package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish-pypi:
    name: Publish to PyPI
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/kwork-mcp/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download validated package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true

  attach-artifacts:
    name: Attach distributions to the existing release
    needs: publish-pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download validated package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - name: Attach without creating or replacing the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Bare file names, so `sha256sum --check SHA256SUMS` works in a
          # directory of downloaded release assets.
          (cd dist && sha256sum -- *.whl *.tar.gz > SHA256SUMS)
          gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY"

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: [package, publish-pypi]
    if: >-
      ${{ needs.package.outputs.is_prerelease == 'false' &&
          !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: mcp-registry
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out released metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Install checksummed MCP publisher
        env:
          MCP_PUBLISHER_VERSION: "1.8.0"
          MCP_PUBLISHER_SHA256: "1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf"
        run: |
          archive="$(mktemp)"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            --output "$archive"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" mcp-publisher
          chmod 0755 mcp-publisher
          ./mcp-publisher --version
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish unchanged verified server.json
        run: |
          for attempt in 1 2 3 4 5; do
            if ./mcp-publisher publish; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep 30
          done
