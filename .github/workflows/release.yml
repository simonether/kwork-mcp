name: Release

on:
  push:
    tags: ["v*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kwork-mcp
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv build
      - name: Smoke test
        run: |
          WHEEL=$(ls dist/*.whl)
          uv run --isolated --no-project --with "$WHEEL" -- python -c "from kwork_mcp.server import create_server; s = create_server(); print('OK')"
      - run: uv publish
      - name: Create GitHub release
        run: |
          TAG="${{ github.ref_name }}"
          PRERELEASE_FLAG=""
          if echo "$TAG" | grep -qE '(a|b|rc|dev)[0-9]'; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG" dist/* --generate-notes $PRERELEASE_FLAG
        env:
          GH_TOKEN: ${{ github.token }}

  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Sync server.json version with tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v | .packages[].version = $v' server.json > server.tmp && mv server.tmp server.json
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish to MCP Registry
        run: |
          for i in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "Attempt $i failed (PyPI propagation?), retrying in 30s..."
            sleep 30
          done
          exit 1
